name: CI

on:
  push:
    branches: [main, stage, production]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Regla del repo: ningun job toca hardware real, siempre MockHardware.
  FIERRO_MOCK_HW: "1"

jobs:
  python:
    name: ruff + pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: fierro
          POSTGRES_PASSWORD: fierro
          POSTGRES_DB: fierro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fierro -d fierro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e apps/device-agent -e "apps/api[postgres]" -r requirements-dev.txt

      - name: Lint
        run: ruff check apps scripts

      - name: Migrate test database
        env:
          FIERRO_API_DSN: postgresql://fierro:fierro@localhost:5432/fierro_test
        run: fierro-api-migrate

      - name: Tests
        env:
          # DSN separado del runtime: test_api.py sigue en SQLite,
          # test_store_pg.py corre contra Postgres real en vez de saltarse.
          FIERRO_TEST_PG_DSN: postgresql://fierro:fierro@localhost:5432/fierro_test
        run: pytest apps/device-agent apps/api -q

  web:
    name: pnpm lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  compose:
    name: docker compose smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and start stack
        run: docker compose up -d --build db api

      - name: Wait for API health
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          echo "API nunca respondio /health"
          exit 1

      - name: Seed synthetic data
        run: python3 scripts/seed_synthetic.py --api http://127.0.0.1:8000 --animals 15 --days 5 --seed 42

      - name: Assert readings persisted
        run: |
          count=$(curl -fsS "http://127.0.0.1:8000/v1/readings?limit=500" | python3 -c "import json,sys; print(len(json.load(sys.stdin)['readings']))")
          echo "readings devueltas: $count"
          test "$count" -gt 0

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v

  promote-guard:
    name: promocion sin divergencia
    if: github.event_name == 'push' && contains(fromJSON('["stage", "production"]'), github.ref_name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verificar que la rama solo avance por promocion
        run: |
          git fetch --quiet origin main
          extra=$(git log --oneline origin/main..HEAD)
          if [ -n "$extra" ]; then
            echo "::error::${{ github.ref_name }} tiene commits que no estan en main."
            echo "Las ramas de entorno solo avanzan promocionando desde main."
            echo "Commits divergentes:"
            echo "$extra"
            exit 1
          fi
          echo "${{ github.ref_name }} desciende limpio de main."
