# Publica imagenes a GHCR (gratis en repo publico).
#
# Se dispara SOLO cuando CI termino en verde sobre esa misma rama: publicar una
# imagen que no paso pruebas es exactamente como se despliega algo roto.
#
# Todavia no hay proveedor de nube elegido, asi que aqui se detiene: la imagen
# queda etiquetada y lista, y el paso de despliegue se enchufa despues sin
# tocar nada de lo de arriba.
name: Publish images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, stage, production]

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: ${{ matrix.image }}
    # Solo si CI paso. Sin esto el chaining no sirve de nada.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      # Las dos imagenes son artefactos independientes. Sin esto, un tropiezo
      # transitorio de Docker Hub al bajar buildkit en una cancela la otra,
      # que fue justo lo que paso en la primera corrida.
      fail-fast: false
      matrix:
        include:
          - image: fierro-api
            dockerfile: apps/api/Dockerfile
          - image: fierro-device
            dockerfile: apps/device-agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run apunta a la rama default por defecto: hay que pedir
          # explicitamente el commit que CI acaba de validar.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.event.workflow_run.head_branch }}
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'production' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
