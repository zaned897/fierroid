[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = [
  "apps/device-agent/src",
  "apps/api/src",
]
testpaths = [
  "apps/device-agent/tests",
  "apps/api/tests",
]

[tool.mypy]
python_version = "3.11"
# Sin `strict = true` a proposito: hoy dejaria 12 errores, y un gate que nace
# en rojo se desactiva a la semana. Estas opciones si estan en verde, asi que
# a partir de aqui cualquier regresion la detiene CI. Subir a strict es un
# ticket aparte.
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
ignore_missing_imports = true

# Las pruebas quedan fuera: anotar fixtures y helpers de prueba cuesta mas de
# lo que aporta, y su valor ya lo da que pasen.
exclude = "tests/"
