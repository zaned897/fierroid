[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
pythonpath = [
  "apps/device-agent/src",
  "apps/api/src",
]
testpaths = [
  "apps/device-agent/tests",
  "apps/api/tests",
]

[tool.mypy]
python_version = "3.11"
strict = true

# Unica concesion: las dependencias de terceros sin stubs. Sin esto habria que
# escribir stubs para psycopg_pool y argon2 antes de poder verificar codigo
# propio, que es pagar por lo ajeno.
ignore_missing_imports = true

# Las pruebas quedan fuera: anotar fixtures y helpers de prueba cuesta mas de
# lo que aporta, y su valor ya lo da que pasen.
exclude = "tests/"
