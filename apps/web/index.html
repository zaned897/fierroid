<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#143c2d" />
    <meta name="description" content="Fierro — pesajes de ganado" />
    <!-- Sello con filo dorado propio: se ve igual en cualquier color de barra. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- iOS compone sobre negro lo que sea transparente: aqui va la opaca. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- React monta la portada. El navegador puede pedir la imagen desde el HTML. -->
    <link rel="preload" as="image" type="image/avif" media="(max-width: 40rem)" imagesrcset="/img/portada-campo-vertical-480.avif 480w, /img/portada-campo-vertical-576.avif 576w" imagesizes="100vw" fetchpriority="high" />
    <link rel="preload" as="image" media="(width > 40rem)" imagesrcset="/img/portada-campo-768.webp 768w, /img/portada-campo-1536.webp 1536w" imagesizes="100vw" fetchpriority="high" />
    <title>Fierro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
