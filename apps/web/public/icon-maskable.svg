    <path d="M18 15c-5-3-4-9 1-9 3 0 4 3 4 6" fill="none" stroke="#c4a35a" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M46 15c5-3 4-9-1-9-3 0-4 3-4 6" fill="none" stroke="#c4a35a" stroke-width="2.6" stroke-linecap="round"/>
    <rect x="16" y="14" width="32" height="34" rx="15"/>
    <ellipse cx="32" cy="42" rx="10" ry="7" fill="#1a2e1a"/>
    <ellipse cx="28" cy="41" rx="1.7" ry="2.3" fill="#c4a35a"/>
    <ellipse cx="36" cy="41" rx="1.7" ry="2.3" fill="#c4a35a"/>
    <circle cx="25" cy="27" r="2.4" fill="#1a2e1a"/>
    <circle cx="39" cy="27" r="2.4" fill="#1a2e1a"/>
