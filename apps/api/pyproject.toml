[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fierro-api"
version = "0.1.0"
description = "Cloud ingest API for cattle weight readings"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
# Opcional a proposito: la API arranca en SQLite sin psycopg instalado.
postgres = ["psycopg[binary,pool]>=3.2"]

[project.scripts]
fierro-api = "fierro_api.main:main"
fierro-api-migrate = "fierro_api.migrate:main"
fierro-api-seed-tenants = "fierro_api.tenancy:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Las migraciones viajan dentro del paquete para que funcionen en la imagen
# Docker, no solo en un checkout del repo.
fierro_api = ["migrations/*.sql"]
