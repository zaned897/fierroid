[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fierro-device"
version = "0.1.0"
description = "Edge agent: RFID + scale capture with durable SQLite outbox"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5",
  "httpx>=0.27",
]

[project.scripts]
fierro-device = "fierro_device.main:main"

[tool.setuptools.packages.find]
where = ["src"]
